<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Вход')}"></head>
<body class="auth-page">
<main class="auth">
    <div class="auth-brand">BugTrack</div>
    <h1>Вход</h1>
    <p class="subtitle">Войдите в рабочее пространство</p>

    <section class="panel">
        <h2>Вход в BugTrack</h2>
        <div class="alert error" th:if="${param.error}">Неверная почта или пароль, либо учётная запись заблокирована</div>
        <div class="alert ok" th:if="${param.logout}">Вы вышли из системы</div>
        <div class="alert ok" th:if="${success}" th:text="${success}">Аккаунт создан</div>
        <form th:action="@{/login}" method="post" class="form">
            <label class="field">
                <span>Почта</span>
                <input type="email" name="email" placeholder="anna@example.ru" required autofocus>
            </label>
            <label class="field">
                <span>Пароль</span>
                <input type="password" name="password" placeholder="••••••••" required>
            </label>
            <div class="actions">
                <button type="submit" class="btn primary">Войти</button>
                <a class="btn" th:href="@{/register}">Регистрация</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
